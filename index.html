<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shopper</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#4CAF50">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#333;font-size:15px;padding:8px}
h1{text-align:center;font-size:20px;margin:6px 0 8px}

/* Stores */
.stores{display:flex;gap:4px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.store-tab{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid #ddd;border-radius:8px;padding:7px 10px;white-space:nowrap;font-size:14px;flex-shrink:0;cursor:pointer}
.store-tab.active{background:#4CAF50;color:#fff;border-color:#4CAF50}
.store-tab .del{color:#e53935;font-size:16px;cursor:pointer;margin-left:2px}
.store-tab.active .del{color:#fff}
.store-tab .edit{cursor:pointer;font-size:14px;opacity:.6}
.add-store-btn{background:#e8f5e9;border:1px dashed #4CAF50;color:#2e7d32;border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer;flex-shrink:0;white-space:nowrap}
.add-store-inline{display:none;align-items:center;gap:4px}
.add-store-inline.show{display:flex}
.add-store-inline input{padding:6px 8px;font-size:14px;border:1px solid #ccc;border-radius:6px;width:110px}
.add-store-inline button{background:#4CAF50;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer}

/* Search */
.search-card{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.search-row{display:flex;gap:6px}
.search-row input{flex:1;padding:7px 9px;font-size:14px;border:1px solid #ccc;border-radius:6px}
.search-row button{background:#1976D2;color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:14px;cursor:pointer}
.results{margin-top:8px}
.result-item{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.result-item.best{border-left:4px solid #4CAF50}
.result-item.jumpable{cursor:pointer;transition:background .15s}
.result-item.jumpable:active{background:#e8f5e9}
.result-item.done{background:#f1f1f1}
.result-item.done .r-price-wrap{color:#999;text-decoration:line-through}
.r-store{font-size:12px;color:#888}
.r-price{font-weight:700;font-size:16px}
.best-tag{background:#4CAF50;color:#fff;font-size:11px;border-radius:4px;padding:2px 6px;margin-left:4px}

/* Form */
.form-card{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.form-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.form-row label{font-size:13px;color:#666;width:72px;flex-shrink:0}
.form-row input,.form-row select{flex:1;min-width:80px;padding:6px 8px;font-size:14px;border:1px solid #ccc;border-radius:6px}
.form-row input[type=number]{max-width:100px}
.disc-row{margin-top:2px}
.disc-row label{color:#e53935;font-weight:700}
.disc-row input{border-color:#e57373;color:#e53935;font-weight:700}
.unit-price-live{color:#e53935;font-weight:700;font-size:14px;margin-top:4px;text-align:center}
.btn-add{background:#4CAF50;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:15px;width:100%;cursor:pointer;margin-top:2px}
.btn-save{background:#FF9800;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:15px;width:100%;cursor:pointer;margin-top:2px;display:none}

/* Sort/filter bar */
.toolbar{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.toolbar label{font-size:13px;color:#666}
.toolbar select{flex:1;min-width:110px;padding:6px 8px;font-size:13px;border:1px solid #ccc;border-radius:6px}
.toolbar .filter-checks{display:flex;gap:10px;align-items:center;font-size:13px;color:#555}
.toolbar input[type=checkbox]{width:16px;height:16px}
.store-total{font-size:13px;color:#2e7d32;font-weight:700;margin-bottom:6px;text-align:center}

/* Products */
.products{margin-top:6px}
.product{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:5px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.product.dup{background:#fffde7;border:1px solid #f9a825}
.product .p-check{width:22px;height:22px;flex-shrink:0;cursor:pointer}
.product .p-info{flex:1;min-width:0}
.product .p-name{font-weight:600;font-size:15px;word-break:break-word}
.product .p-meta{font-size:13px;color:#888;margin-top:2px}
.product .p-unit-price{color:#e53935;font-weight:700;font-size:13px;margin-top:2px}
.p-price-row{display:flex;align-items:center;gap:6px;justify-content:flex-end;min-width:90px}
.product .p-price{font-weight:700;color:#2e7d32;font-size:16px;white-space:nowrap}
.product .p-price.disc-now{color:#e53935}
.product .p-price-strike{color:#999;text-decoration:line-through;font-size:15px;white-space:nowrap}
.product .p-toggle{cursor:pointer;font-size:14px;color:#1976D2;background:#e3f2fd;border:none;border-radius:6px;padding:3px 6px;font-size:12px;line-height:1}
.product .p-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.product .act{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:14px;background:#f1f1f1}
.product .del-p{color:#e53935}
.product .edit-p{color:#1976D2}
.product .hist-p{color:#8d6e63}
.product .copy-p{color:#0288d1}
.product.bought{opacity:.45}
.product.bought .p-name{text-decoration:line-through}

/* Export/Import buttons */
.io-bar{display:flex;gap:8px;margin-bottom:8px}
.btn-export{flex:1;background:#1976D2;color:#fff;border:none;border-radius:8px;padding:10px;font-size:15px;font-weight:600;cursor:pointer}
.btn-import{flex:1;background:#FF9800;color:#fff;border:none;border-radius:8px;padding:10px;font-size:15px;font-weight:600;cursor:pointer}

.empty{text-align:center;color:#aaa;padding:20px;font-size:15px}

/* Modal */
.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:16px;width:90%;max-width:340px;max-height:80vh;display:flex;flex-direction:column}
.modal h3{font-size:16px;margin-bottom:10px}
.modal input,.modal textarea,.modal select{width:100%;padding:8px;font-size:14px;border:1px solid #ccc;border-radius:6px;margin-bottom:10px}
.modal-btns{display:flex;gap:8px}
.modal-btns button{flex:1;padding:9px;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.modal-btns .ok{background:#4CAF50;color:#fff}.modal-btns .cancel{background:#eee;color:#333}
.hist-list{overflow-y:auto;flex:1;margin-bottom:10px}
.hist-item{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid #eee;font-size:14px}
.hist-item .hd{color:#888;font-size:13px}
.hist-item .hp{font-weight:600}
.hist-item .hp.disc{color:#e53935}
.hist-empty{color:#aaa;text-align:center;padding:16px}
.copy-opt{padding:9px;border-radius:8px;cursor:pointer;margin-bottom:5px;border:1px solid #eee}
.copy-opt:hover{background:#f1f8e9}
.copy-opt.active{background:#e8f5e9;border-color:#4CAF50}
</style>
</head>
<body>
<h1>🛒 Shopper</h1>

<div class="stores" id="storeTabs"></div>

<div class="io-bar">
<button class="btn-export" onclick="exportData()">📤 Экспорт</button>
<button class="btn-import" onclick="document.getElementById('importFile').click()">📥 Импорт</button>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
</div>

<div class="search-card">
<div class="search-row">
<input type="text" id="searchInput" placeholder="Найти товар во всех магазинах...">
<button onclick="doSearch()">🔍</button>
</div>
<div class="results" id="searchResults"></div>
</div>

<div class="form-card">
<div class="form-row"><label>Товар:</label><input type="text" id="pName" placeholder="Название"></div>
<div class="form-row"><label>Цена ₽:</label><input type="number" id="pPrice" placeholder="0" step="0.01"><label>Кол-во:</label><input type="number" id="pQty" placeholder="1" step="0.001"></div>
<div class="form-row disc-row"><label>Скидка ₽:</label><input type="number" id="pDiscount" placeholder="цена со скидкой" step="0.01"></div>
<div class="form-row"><label>Ед.изм:</label>
<select id="pUnit" onchange="onUnitChange()">
<option value="шт">шт</option><option value="кг">кг</option><option value="л">л</option><option value="г">г</option><option value="мл">мл</option><option value="уп">упаковка</option>
</select></div>
<div class="form-row" id="pkgRow" style="display:none"><label>В уп.:</label><input type="number" id="pPkgQty" placeholder="сколько" step="0.001"><select id="pPkgUnit"><option value="г">г</option><option value="мл">мл</option><option value="шт">шт</option></select></div>
<div class="unit-price-live" id="unitPriceLive"></div>
<button class="btn-add" id="btnAdd" onclick="addProduct()">+ Добавить товар</button>
<button class="btn-save" id="btnSaveEdit" onclick="saveEdit()">💾 Сохранить изменения</button>
</div>

<div class="toolbar">
<select id="sortSel" onchange="renderProducts()"><option value="name">Сортировка: по названию</option><option value="price">Сортировка: по цене ↑</option><option value="priceDesc">Сортировка: по цене ↓</option></select>
<span class="filter-checks"><label><input type="checkbox" id="onlyNotBought" onchange="renderProducts()"> Только не купленные</label></span>
</div>
<div class="store-total" id="storeTotal"></div>

<div class="products" id="productList"></div>

<!-- History modal -->
<div class="modal-bg" id="histModal"><div class="modal"><h3>История цен</h3><div class="hist-list" id="histList"></div><div class="modal-btns"><button class="cancel" onclick="closeHist()">Закрыть</button></div></div></div>

<!-- Copy modal -->
<div class="modal-bg" id="copyModal"><div class="modal"><h3>Копировать товар в магазин</h3><div id="copyStoreList"></div><div class="modal-btns"><button class="cancel" onclick="closeCopy()">Отмена</button></div></div></div>

<!-- Rename modal -->
<div class="modal-bg" id="renameModal"><div class="modal"><h3>Переименовать магазин</h3><input type="text" id="renameInput"><div class="modal-btns"><button class="cancel" onclick="closeRename()">Отмена</button><button class="ok" onclick="confirmRename()">OK</button></div></div></div>

function normalizeProducts(stores){
  stores.forEach(function(s){
    if(!s.products)s.products={};
    Object.keys(s.products).forEach(function(pid){
      var p=s.products[pid];
      if(!p||typeof p!=='object')return;
      // Unify "done" legacy -> "bought"
      if(p.bought===undefined&&p.done!==undefined)p.bought=p.done;
      if(p.bought===undefined)p.bought=false;
      // Discount
      if(p.discount===undefined)p.discount=null;
      if(p.useDisc===undefined)p.useDisc=false;
      // History
      if(!Array.isArray(p.history))p.history=[];
    });
  });
}

function load(){
  function hasAnyProduct(stores){
    if(!stores||!stores.length)return false;
    for(var i=0;i<stores.length;i++){if(stores[i].products&&Object.keys(stores[i].products).length)return true;}
    return false;
  }
  var found=false;
  try{var d=JSON.parse(localStorage.getItem(DB_KEY));if(d&&d.stores&&d.stores.length&&hasAnyProduct(d.stores)){data=d;found=true;}}catch(e){}
  if(!found){['shopper_data_v3','shopper_data_v4'].forEach(function(k){try{var d=JSON.parse(localStorage.getItem(k));if(d&&d.stores&&d.stores.length&&hasAnyProduct(d.stores)){data=d;if(!data.activeStore||!data.stores.find(function(s){return s.id===data.activeStore;}))data.activeStore=data.stores[0].id;found=true;save();}}catch(e){}});}
  // First run or empty saved data: use the embedded preset (works even if localStorage is blocked).
  if(!found){data=initData();try{save();}catch(e){}}
  if(!data.activeStore||!data.stores.find(function(s){return s.id===data.activeStore;}))data.activeStore=data.stores[0].id;
  data.renameId=null;data.editId=null;data.copyPid=null;
  normalizeProducts(data.stores);
}
function save(){
  try{localStorage.setItem(DB_KEY,JSON.stringify(data));}
  catch(e){/* storage may be unavailable (private mode / file:// ); app continues with in-memory data */}
}

// --- Unit price calc (uses active price) ---
function calcUnitPrice(p){
  if(!p)return null;
  var price=activePrice(p);
  if(!(price>0))return null;
  if(p.unit==='уп'&&p.pkgQty>0){
    if(p.pkgUnit==='г'||p.pkgUnit==='мл')return price/(p.pkgQty/1000);
    if(p.pkgUnit==='шт')return price/p.pkgQty;
  }
  if(p.unit==='кг'||p.unit==='л')return (p.qty>0)?price/p.qty:null;
  if(p.unit==='г'||p.unit==='мл')return (p.qty>0)?price/(p.qty/1000):null;
  if(p.unit==='шт')return (p.qty>0)?price/p.qty:null;
  return null;
}
function unitPriceLabel(p){
  var up=calcUnitPrice(p);
  if(up===null)return '';
  var u=p.unit==='уп'?(p.pkgUnit||'шт'):p.unit;
  if(u==='г'||u==='мл')u=u==='г'?'кг':'л';
  return up.toFixed(2)+' ₽/'+u;
}
function onUnitChange(){
  var u=document.getElementById('pUnit').value;
  document.getElementById('pkgRow').style.display=(u==='уп')?'flex':'none';
  calcLive();
}
function calcLive(){
  var price=parseFloat(document.getElementById('pPrice').value);
  if(!(price>0))price=0;
  var disc=parseFloat(document.getElementById('pDiscount').value);
  if(!(disc>0))disc=0;
  var qty=parseFloat(document.getElementById('pQty').value);
  if(!(qty>0))qty=1;
  var unit=document.getElementById('pUnit').value;
  var pkgQty=parseFloat(document.getElementById('pPkgQty').value);
  if(!(pkgQty>0))pkgQty=0;
  var pkgUnit=document.getElementById('pPkgUnit').value;
  var tmp={price:price,qty:qty,unit:unit,pkgQty:pkgQty>0?pkgQty:null,pkgUnit:pkgUnit,discount:disc>0?disc:null,useDisc:false};
  var up=calcUnitPrice(tmp);
  var el=document.getElementById('unitPriceLive');
  if(up&&up>0){el.textContent=unitPriceLabel(tmp);}
  else el.textContent='';
}

// History recording helpers
function pushHistory(p,type,price){
  if(!Array.isArray(p.history))p.history=[];
  p.history.push({d:new Date().toISOString(),type:type,price:price});
  if(p.history.length>200)p.history=p.history.slice(-200);
}

function startEdit(pid){
  var st=getStore();
  var p=st.products[pid];
  if(!p){alert('Товар не найден');return;}
  data.editId=pid;
  document.getElementById('pName').value=p.name;

  document.getElementById('pDiscount').value=p.discount||'';
  document.getElementById('pQty').value=p.qty;
  document.getElementById('pUnit').value=p.unit;
  if(p.pkgQty){document.getElementById('pPkgQty').value=p.pkgQty;}
  if(p.pkgUnit)document.getElementById('pPkgUnit').value=p.pkgUnit;

  document.getElementById('btnAdd').style.display='none';
  document.getElementById('btnSaveEdit').style.display='block';

function editProduct(pid){startEdit(pid);}
function saveEdit(){
  if(!data.editId)return;
  var f=readForm();
  if(!f.name||!f.price||f.price<=0){alert('Введите название и цену');return;}
  var st=getStore();
  var p=st.products[data.editId];
  if(!p){resetForm();return;}
  p.name=f.name;
  // History on base price change
  if(Math.abs((p.price||0)-f.price)>0.001){pushHistory(p,'base',f.price);p.price=+f.price.toFixed(2);}
  // History on discount change
  var newDisc=f.discount>0?+f.discount.toFixed(2):null;
  if((p.discount||null)!==newDisc){if(newDisc)pushHistory(p,'discount',newDisc);p.discount=newDisc;}
  p.qty=+f.qty.toFixed(3);
  p.unit=f.unit;
  if(f.unit==='уп'){
    p.pkgQty=parseFloat(document.getElementById('pPkgQty').value)||1;
    p.pkgUnit=document.getElementById('pPkgUnit').value;
  }else{delete p.pkgQty;delete p.pkgUnit;}
  resetForm();
  save();renderProducts();
}

  delete st.products[pid];
  save();renderProducts();
}

// --- Products list rendering with sort/filter/dup highlight/total ---
function computeDupNames(st){
  var names={};
  Object.keys(st.products).forEach(function(pid){
    var n=st.products[pid].name.toLowerCase();
    names[n]=(names[n]||0)+1;
  });
  var dup={};
  Object.keys(names).forEach(function(n){if(names[n]>1)dup[n]=true;});
  return dup;
}
function renderProducts(){
  var st=getStore();
  var c=document.getElementById('productList');
  var onlyNotBought=document.getElementById('onlyNotBought').checked;
  var sortMode=document.getElementById('sortSel').value;
  var entries=Object.keys(st.products).map(function(pid){return{pid:pid,p:st.products[pid]};});
  if(onlyNotBought)entries=entries.filter(function(e){return !e.p.bought;});
  if(sortMode==='price')entries.sort(function(a,b){return activePrice(a.p)-activePrice(b.p);});
  else if(sortMode==='priceDesc')entries.sort(function(a,b){return activePrice(b.p)-activePrice(a.p);});
  else entries.sort(function(a,b){return a.p.name.localeCompare(b.p.name,'ru');});

  var dupNames=computeDupNames(st);
  var totalAll=entries.reduce(function(s,e){return +s+(e.p.bought?0:activePrice(e.p)*(e.p.qty||1));},0);
  var boughtSum=entries.filter(function(e){return e.p.bought;}).reduce(function(s,e){return +s+activePrice(e.p)*(e.p.qty||1);},0);
  var cntEntries=entries.length;
  document.getElementById('storeTotal').textContent='Всего ('+entries.length+'): '+(totalAll.toFixed(2))+' ₽'+(boughtSum>0?' · куплено: '+boughtSum.toFixed(2)+' ₽':'');

  if(!entries.length){c.innerHTML='<div class="empty">Нет товаров.<br>Добавьте первый выше ☝️</div>';return;}
  var html='';
  entries.forEach(function(e){
    var p=e.p;
    var isDup=dupNames[p.name.toLowerCase()]||false;
    var upl=unitPriceLabel(p);
    var usingDisc=(p.useDisc&&p.discount>0);
    var shown=activePrice(p);
    var priceHtml;
    if(p.discount>0){
      if(usingDisc){priceHtml='<span class="p-price disc-now">'+p.discount+' ₽</span>';}
      else{priceHtml='<span class="p-price">'+p.price+' ₽</span><span class="p-price-strike" style="margin-left:4px">'+p.discount+' ₽</span>';}
    }else{priceHtml='<span class="p-price">'+p.price+' ₽</span>';}
    var toggleHtml=(p.discount>0)?'<button class="p-toggle" onclick="togglePrice(\''+e.pid+'\')">'+(usingDisc?'осн':'скидка')+'</button>':'';
    html+='<div class="product'+(p.bought?' bought':'')+(isDup?' dup':'')+'">';
    html+='<input type="checkbox" class="cb" '+(p.bought?'checked':'')+' onchange="toggleBought(\''+e.pid+'\')">';
    html+='<div class="p-info">';
    html+='<div class="p-name">'+esc(p.name)+(isDup?' <span style="color:#f9a825;font-size:11px">⚑ дубль</span>':'')+'</div>';
    html+='<div class="p-meta">'+p.qty+' '+p.unit+(p.unit==='уп'&&p.pkgQty?' ('+p.pkgQty+' '+p.pkgUnit+')':'')+'</div>';
    if(upl)html+='<div class="p-unit-price">'+upl+'</div>';
    html+='</div>';
    html+='<div class="p-price-row">'+priceHtml+toggleHtml+'</div>';
    html+='<div class="p-actions">';
    html+='<span class="act hist-p" title="История цен" onclick="openHist(\''+e.pid+'\')">🕘</span>';
    html+='<span class="act copy-p" title="Копировать в другой магазин" onclick="openCopy(\''+e.pid+'\')">⧉</span>';
    html+='<span class="act edit-p" title="Изменить" onclick="editProduct(\''+e.pid+'\')">✏️</span>';
    html+='<span class="act del-p" title="Удалить" onclick="deleteProduct(\''+e.pid+'\')">✕</span>';
    html+='</div>';
    html+='</div>';
  });
  c.innerHTML=html;
}

    Object.keys(s.products).forEach(function(pid){
      var p=s.products[pid];
      if(p.name.toLowerCase().indexOf(q)>=0){
        results.push({sid:s.id,pid:pid,store:s.name,p:p});
      }
    });
  });
  if(!results.length){c.innerHTML='<div class="empty">Ничего не найдено</div>';return;}
  results.sort(function(a,b){
    var ua=calcUnitPrice(a.p),ub=calcUnitPrice(b.p);
    if(ua!==null&&ub!==null)return ua-ub;
    return activePrice(a.p)-activePrice(b.p);
  });
  var html='';
  results.forEach(function(r,i){
    var upl=unitPriceLabel(r.p);
    var isBest=i===0;
    html+='<div class="result-item'+(isBest?' best':'')+(r.p.bought?' done':'')+' jumpable" onclick="searchJumpTo(\''+r.sid+'\',\''+r.pid+'\')">';
    html+='<div><div style="font-weight:'+(isBest?'700':'400')+'">'+esc(r.p.name)+'</div>';
    if(upl)html+='<div class="r-store">'+esc(r.store)+' · '+r.p.qty+' '+r.p.unit+' · <span style="color:#e53935">'+esc(upl)+'</span></div>';
    else html+='<div class="r-store">'+esc(r.store)+' · '+r.p.qty+' '+r.p.unit+'</div>';
    html+='</div>';
    html+='<div style="text-align:right"><span class="r-price-wrap"><span class="r-price">'+activePrice(r.p).toFixed(2)+' ₽</span>';
    if(isBest)html+='<span class="best-tag">⭐ дешевле</span>';
    html+='</span></div></div>';
  });
  c.innerHTML=html;
}
function searchJumpTo(sid,pid){
  // switch store, mark as bought, render, scroll to it
  var st=data.stores.find(function(s){return s.id===sid;});
  if(!st){return;}
  data.activeStore=sid;
  var p=st.products[pid];
  if(p&&!p.bought){p.bought=true;}
  save();
  renderStores();
  renderProducts();
  document.getElementById('searchInput').value='';
  document.getElementById('searchResults').innerHTML='';
  var prodEls=document.querySelectorAll('.product');
  for(var i=0;i<prodEls.length;i++){
    var cb=prodEls[i].querySelector('.cb');
    if(cb&&cb.getAttribute('onchange').indexOf(pid)>=0){
      prodEls[i].scrollIntoView({behavior:'smooth',block:'center'});
      prodEls[i].style.transition='background .5s';
      prodEls[i].style.background='#fff9c4';
      setTimeout(function(){prodEls[i].style.background='';},1200);
      break;
    }
  }
}

// --- Export / Import ---
function exportData(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='shopper_data.json';
  a.click();
}
function importData(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var imported=JSON.parse(e.target.result);
      if(!imported.stores){alert('Неверный формат файла');return;}
      data=imported;
      if(!data.activeStore||!data.stores.find(function(s){return s.id===data.activeStore;}))data.activeStore=data.stores[0].id;
      data.renameId=null;data.editId=null;data.copyPid=null;
      normalizeProducts(data.stores);
      save();renderStores();renderProducts();
      alert('Данные импортированы!');
    }catch(err){alert('Ошибка чтения файла');}
  };
  reader.readAsText(file);
}

// Init
load();
renderStores();
renderProducts();
document.getElementById('searchInput').addEventListener('input',doSearch);
document.getElementById('renameInput').addEventListener('keydown',function(e){if(e.key==='Enter')confirmRename();if(e.key==='Escape')closeRename();});
['pPrice','pQty','pPkgQty','pDiscount'].forEach(function(fid){
  var el=document.getElementById(fid);
  if(el)el.addEventListener('input',calcLive);
});
onUnitChange();

// PWA: register service worker (only works over http/https, not file://)
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

// Show a small data-status badge so it's obvious data loaded.
(function(){
  try{
    var total=0;
    data.stores.forEach(function(s){total+=Object.keys(s.products).length;});
    var badge=document.createElement('div');
    badge.style.cssText='position:fixed;bottom:6px;right:8px;background:#333;color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;opacity:.7;z-index:999;font-family:system-ui,sans-serif;';
    badge.textContent=data.stores.length+' магазинов · '+total+' товаров';
    document.body.appendChild(badge);
  }catch(e){}
})();
